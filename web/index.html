<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぜんまい</title>
<style>
  :root {
    --bg: #f4efe6;        /* 紙 */
    --ink: #1f1b16;
    --dim: #8a7f70;
    --rule: #d9cfbe;
    --accent: #7a5a2f;
    --warn: #b03a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14120f; --ink: #e8e0d2; --dim: #7d7466; --rule: #2c2823; --accent: #c9a86a; --warn: #e0776a; }
  }
  * { box-sizing: border-box }
  html, body { height: 100% }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    display: flex; flex-direction: column;
    line-height: 1.85;
  }
  /* ステータス行 */
  #status {
    flex: 0 0 auto; display: flex; justify-content: space-between; gap: 1em;
    padding: .5em max(1em, calc((100% - 36em) / 2));
    border-bottom: 1px solid var(--rule);
    font-size: .85rem; color: var(--dim); letter-spacing: .04em;
  }
  #place { color: var(--ink) }
  /* 本文 */
  #screen {
    flex: 1 1 auto; overflow-y: auto;
    padding: 1.2em max(1em, calc((100% - 36em) / 2)) 2em;
  }
  #screen p { margin: 0 0 .9em; white-space: pre-wrap }
  #screen p.cmd { color: var(--accent) }
  #screen p.cmd::before { content: "> " }
  /* ★未訳の行は英語のまま出る。開発中は薄く印を付ける（穴が目で見える） */
  #screen p.raw { color: var(--dim); border-left: 2px solid var(--warn); padding-left: .6em }
  /* 入力 */
  #bar {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: .4em;
    padding: .6em max(1em, calc((100% - 36em) / 2)) 1em;
    border-top: 1px solid var(--rule);
  }
  #bar span { color: var(--accent) }
  #input {
    flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink);
    font: inherit; padding: .2em 0;
  }
  #hint { font-size: .8rem; color: var(--dim); padding: 0 max(1em, calc((100% - 36em) / 2)) .8em }
</style>
</head>
<body>
  <div id="status"><span id="place">　</span><span id="score"></span></div>
  <div id="screen" aria-live="polite"></div>
  <div id="bar"><span>&gt;</span><input id="input" autocomplete="off" autocapitalize="off"
    autocorrect="off" spellcheck="false" placeholder="英語のコマンドを打つ（例: open mailbox）"></div>
  <div id="hint">ぜんまい —— 日本語で読むテキストアドベンチャー。<span id="stat"></span></div>

  <script src="../vendor/zvm.min.js"></script>
  <script src="../src/translate.js"></script>
  <script src="../src/glk-shim.js"></script>
  <script src="main.js"></script>
</body>
</html>
