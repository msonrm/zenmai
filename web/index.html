<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぜんまい</title>
<style>
  :root {
    --bg: #f4efe6;        /* 本文の紙 */
    --panel: #fbf8f2;     /* ヘッダとフッタ（本文より薄い） */
    --ink: #1f1b16;
    --dim: #8a7f70;
    --rule: #ded4c3;
    --accent: #7a5a2f;
    --warn: #b03a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f; --panel: #1e1a16; --ink: #e8e0d2; --dim: #7d7466;
      --rule: #2f2a24; --accent: #c9a86a; --warn: #e0776a;
    }
  }
  * { box-sizing: border-box }
  html, body { height: 100% }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    display: flex; flex-direction: column; line-height: 1.85;
  }
  /* ★本文だけを 36em の段に収める。ヘッダとフッタは全幅
     （同じ段組みを掛けると、項目が多い側が押し込められて改行が入る） */
  .gutter { padding-left: max(1em, calc((100% - 36em) / 2)); padding-right: max(1em, calc((100% - 36em) / 2)) }
  .edge { padding-left: 1.2em; padding-right: 1.2em }
  /* 押し込められても折り返さず、必要なら詰める */
  #title, #place, #score, #stat { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

  /* ── ヘッダ: 左に題、右に場所と得点 ── */
  #head {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 1em;
    padding-top: .5em; padding-bottom: .5em;
    background: var(--panel); border-bottom: 1px solid var(--rule);
    font-size: .82rem; letter-spacing: .04em; color: var(--dim);
  }
  #title { flex: 0 1 auto; min-width: 4em }
  #title b { color: var(--ink); font-weight: 600 }
  #place { flex: 1 1 auto; min-width: 0; text-align: right; color: var(--ink); font-size: .95rem }
  #score { flex: 0 0 auto; font-variant-numeric: tabular-nums }

  /* ── 本文 ── */
  #screen { flex: 1 1 auto; overflow-y: auto; padding-top: 1.3em; padding-bottom: 2em; background: var(--bg) }
  #screen p { margin: 0 0 .9em; white-space: pre-wrap }
  #screen p.cmd { color: var(--accent) }
  #screen p.cmd::before { content: "> " }
  /* ★未訳の行は英語のまま出す。開発中は罫を付けて目で見えるようにする */
  #screen p.raw { color: var(--dim); border-left: 2px solid var(--warn); padding-left: .6em }

  /* ── フッタ: ★コマンド行は本文と同じ段に揃える。成績は右下に置く ── */
  #foot {
    flex: 0 0 auto; position: relative;
    padding-top: .7em; padding-bottom: .9em;
    background: var(--panel); border-top: 1px solid var(--rule);
  }
  /* `>` の左端が本文の左端、入力欄の右端が本文の右端に来る */
  #prompt { display: flex; align-items: baseline; gap: .5em }
  #prompt > span.caret { color: var(--accent); flex: 0 0 auto }
  #input {
    flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: 0;
    color: var(--ink); font: inherit; padding: .15em 0;
    border-bottom: 1px solid var(--rule);
  }
  #input:focus { border-bottom-color: var(--accent) }
  #input::placeholder { color: var(--dim) }
  /* 右下。段の外なので本文の右端より外側に出る */
  #stat {
    position: absolute; right: 1.2em; bottom: .15em;
    font-size: .7rem; line-height: 1.4; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  /* 狭いときは説明を畳む（題だけ残す）→ さらに狭ければ成績も畳む */
  @media (max-width: 46em) { #title .tag { display: none } }
  /* 段の余白が尽きると入力欄に重なるので畳む（1em の余白しか無くなる幅） */
  @media (max-width: 40em) { #stat { display: none } }
</style>
</head>
<body>
  <div id="head" class="edge">
    <span id="title"><b>ぜんまい</b><span class="tag"> —— 日本語で読むテキストアドベンチャー</span></span>
    <span id="place">　</span>
    <span id="score"></span>
  </div>
  <div id="screen" class="gutter" aria-live="polite"></div>
  <div id="foot">
    <div id="prompt" class="gutter">
      <span class="caret">&gt;</span>
      <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="英語のコマンドを打つ（例: open mailbox）">
    </div>
    <span id="stat"></span>
  </div>

  <script src="../vendor/zvm.min.js"></script>
  <script src="../src/translate.js"></script>
  <script src="../src/glk-shim.js"></script>
  <script src="main.js"></script>
</body>
</html>
