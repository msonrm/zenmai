; Zork I の曲と絵の割り当て（作品 ZORK1.ZMP と同じ名前の .INI）。
; ★キーは状態行の英語の部屋名（大文字小文字は区別しない）。末尾の * で前方一致、* だけで既定。
;   上から順に見て最初に合ったもの。曲が - なら止める。合うものが無ければ止める。
;   同じ曲の部屋どうしを動くときは頭に戻らず続く。
; ★曲はアンビエントの見本（gen_ambient_mml.py）。差し替えるときは同じ名前の .M を置けばよい（16KB まで）

[music]
; 外（家のまわり・森・崖）
West of House       = FIELD.M
North of House      = FIELD.M
South of House      = FIELD.M
Behind House        = FIELD.M
Forest*             = FIELD.M
Clearing            = FIELD.M
Up a Tree           = FIELD.M
Stone Barrow        = FIELD.M
Canyon View         = FIELD.M
Rocky Ledge         = FIELD.M
Canyon Bottom       = FIELD.M
End of Rainbow      = FIELD.M
On the Rainbow      = FIELD.M
; 家の中
Kitchen             = HOUSE.M
Living Room         = HOUSE.M
Attic               = HOUSE.M
; ダム・川・湖
Dam*                = WATER.M
Reservoir*          = WATER.M
Stream*             = WATER.M
Frigid River        = WATER.M
Shore               = WATER.M
Sandy Beach         = WATER.M
White Cliffs Beach  = WATER.M
Aragain Falls       = WATER.M
Maintenance Room    = WATER.M
Deep Canyon         = WATER.M
; 神殿・古い部屋
Temple              = TEMPLE.M
Altar               = TEMPLE.M
Egyptian Room       = TEMPLE.M
Torch Room          = TEMPLE.M
Dome Room           = TEMPLE.M
Entrance to Hades   = TEMPLE.M
Land of the Dead    = TEMPLE.M
Engravings Cave     = TEMPLE.M
Mirror Room         = TEMPLE.M
Cold Passage        = TEMPLE.M
Atlantis Room       = TEMPLE.M
Slide Room          = TEMPLE.M
; それ以外（地下室・洞窟・迷路・鉱山）
*                   = DEEP.M

[picture]
; ★絵はまだ形だけ（割り当てを記録に書くだけ。絵のファイルは無い）
West of House       = WHOUSE

[theme]
; ★画面の装い（色）の全体の既定。背景など = #RGB（16 進 3 桁）/ 文字 = 名前（black blue red magenta green cyan yellow white）
;   band 上の帯 / side 本文の左右 / input 入力欄 / body 本文の地 / ruby ふりがな（以上 #RGB）
;   status 場所 / score 得点 / prompt 入力欄の ＞ / input_fg コマンド文字（キャレットと ▼ も同じ色）/ text 本文 / echo 反映したコマンド
;   ★text と echo は全体だけ（履歴の行が色を持つので、場面で替えると混ざる）。書かなければ今までの色（家の中はこれ）
; band = #237
; pattern = HOUSE.MAG   ; 本文の左右の縁の絵柄（.MAG・80×320 の左半分が左・右半分が右）。- で無し
; text = white

[scene]
; 部屋名 = キー=値 …（部屋名の照合は [music] と同じ）。書いたキーだけが、その部屋に居る間だけ替わる
