[picture]
; ★絵はまだ形だけ（割り当てを記録に書くだけ。絵のファイルは無い）
West of House       = WHOUSE

[theme]
; ★画面の装い（色）の全体の既定。背景など = #RGB（16 進 3 桁）/ 文字 = 名前（black blue red magenta green cyan yellow white）
;   band 上の帯 / top 本文の上の細い帯 / side 本文の左右 / input 入力欄 / body 本文の地 / ruby ふりがな（以上 #RGB）
;   status 場所 / score 得点 / prompt 入力欄の ＞ / input_fg コマンド文字（キャレットと ▼ も同じ色）/ text 本文 / echo 反映したコマンド
;   ★text と echo は全体だけ（履歴の行が色を持つので、場面で替えると混ざる）。書かなければ今までの色（家の中はこれ）
; band = #237
; text = white

[scene]
; 部屋名 = キー=値 …（部屋名の照合は [music] と同じ）。書いたキーだけが、その部屋に居る間だけ替わる
