Frigid River        = WATER.M
Shore               = WATER.M
Sandy Beach         = WATER.M
White Cliffs Beach  = WATER.M
Aragain Falls       = WATER.M
Maintenance Room    = WATER.M
Deep Canyon         = WATER.M
; 神殿・古い部屋
