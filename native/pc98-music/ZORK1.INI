; Zork I の曲と絵の割り当て（作品 ZORK1.ZMP と同じ名前の .INI）。
; ★キーは状態行の英語の部屋名（大文字小文字は区別しない）。末尾の * で前方一致、* だけで既定。
;   上から順に見て最初に合ったもの。曲が - なら止める。合うものが無ければ止める。
;   同じ曲の部屋どうしを動くときは頭に戻らず続く。
; ★曲はアンビエントの見本（gen_ambient_mml.py）。差し替えるときは同じ名前の .M を置けばよい（16KB まで）

[music]
; 外（家のまわり・森・崖）
West of House       = FIELD.M
North of House      = FIELD.M
South of House      = FIELD.M
Behind House        = FIELD.M
Forest*             = FIELD.M
Clearing            = FIELD.M
Up a Tree           = FIELD.M
Stone Barrow        = FIELD.M
Canyon View         = FIELD.M
Rocky Ledge         = FIELD.M
Canyon Bottom       = FIELD.M
End of Rainbow      = FIELD.M
On the Rainbow      = FIELD.M
